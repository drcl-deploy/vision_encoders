theia_tiny_node:
  ros__parameters:
    # model
    hf_name: theaiinstitute/theia-tiny-patch16-224-cdiv
    model_path: models/theia_tiny.onnx
    opset: 17

    # raw frame size on the wire (mirrors the hardware camera; sim sends the same).
    raw_frame_width: 640
    raw_frame_height: 480

    # model input size — must match what the ONNX model was exported at, and the
    # resolution the policy was trained against. Frame is resized raw -> model_input
    # before ImageNet normalization.
    model_input_width: 57
    model_input_height: 32

    # TCP camera source — matches wire format of scripts/camera_streamer.py
    # and the sim's head-camera TCP server in unitree_sdk2_bridge.h.
    # Real Orin:  192.168.123.164
    # Sim:        127.0.0.1
    camera_ip: "127.0.0.1"
    camera_port: 5555

    # node
    embedding_topic: /theia_embedding
