theia_tiny_node:
  ros__parameters:
    # model
    hf_name: theaiinstitute/theia-tiny-patch16-224-cddsv
    model_path: models/theia_tiny.onnx
    opset: 17

    # raw frame size on the wire (mirrors the hardware camera; sim sends the same).
    raw_frame_width: 640
    raw_frame_height: 480

    # model input size — must match what the ONNX model was exported at, and the
    # resolution the policy was trained against. Frame is resized raw -> model_input
    # before ImageNet normalization.
    model_input_width: 57
    model_input_height: 32

    # TCP camera source — matches wire format of scripts/camera_streamer.py
    # and the sim's head-camera TCP server in unitree_sdk2_bridge.h.
    # Offboard (desktop):  192.168.123.164  (Orin IP, streamer runs on Orin)
    # Sim:                 127.0.0.1        (unitree_mujoco on same machine)
    # Onboard:             127.0.0.1        (streamer + node both on Orin;
    #                                        auto-set by launch arg onboard:=true)
    # camera_ip: "192.168.123.164" # real, orin
    camera_ip: "127.0.0.1" # sim / onboard
    camera_port: 5555

    # node
    embedding_topic: /theia_embedding
    # When true, also publish the post-resize, pre-normalize input frame on
    # /theia_input_frame (sensor_msgs/Image, rgb8). Pair with `ros2 bag record`
    # via launch arg `record:=...` to capture (frame, embedding) datasets.
    publish_input_frame: true
    input_frame_topic: /theia_input_frame
    # inference tick rate (Hz). Inference still only fires when a fresh frame
    # is available, so going above the camera FPS just wastes ticks.
    inference_rate_hz: 50.0
