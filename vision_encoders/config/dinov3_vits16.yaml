model:
  name: "dinov3_vits16"
  architecture: "vit_small"
  patch_size: 16
  embed_dim: 192
  num_heads: 6
  depth: 12
  
  weights:
    url: "https://dl.fbaipublicfiles.com/dinov3/dinov3_vits16_pretrain_lvd1689m-08c60483.pth"
    filename: "dinov3_vits16_pretrain_lvd1689m-08c60483.pth"

preprocessing:
  input_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  interpolation: "bicubic"

features:
  output_type: "patch_tokens"  # cls_token, avg_pool, or patch_tokens
  normalize: true

runtime:
  device: "cuda"  # or cpu
  dtype: "float32"

topics:
  image_input: "image_rgb"
  features_output: "image_features"
