model:
  name: 'dinov3_vits16'  # or dinov3_vitb16, dinov3_vitl16, etc.
  repo_path: '/home/learning/shravan/dinov3'
  model_path: '/home/learning/shravan/ros2_ws/src/vision_encoders/vision_encoders/models/dinov3_vits16_pretrain.pth'  # Adjust path
  device: 'cuda'  # or 'cpu'

preprocessing:
  input_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  interpolation: "bicubic"

features:
  output_type: "cls_token"
  normalize: true

runtime:
  device: "cuda"
  dtype: "float32"

topics:
  image_input: "image_rgb"
  features_output: "image_features"

